[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personality-insight-agent"
version = "1.0.0"
description = "基于心理学框架的人物画像分析Agent，借鉴Nuwa-Skill架构"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
